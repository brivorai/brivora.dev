<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" fill="none">
  <!-- TODO: Replace with final hand-drawn diagram -->
  <!-- Merkle Tree Construction -->
  <style>
    text { font-family: 'Virgil', 'Caveat', 'Comic Sans MS', cursive; fill: currentColor; }
    .node { stroke: currentColor; stroke-width: 1.5; fill: none; }
    .edge { stroke: currentColor; stroke-width: 1; }
    .label { font-size: 11px; }
    .hash { font-size: 10px; opacity: 0.5; font-family: monospace; }
    .title { font-size: 16px; font-weight: bold; }
    .annotation { font-size: 11px; opacity: 0.6; font-style: italic; }
  </style>

  <text class="title" x="280" y="30">Merkle Tree</text>

  <!-- Root -->
  <rect class="node" x="290" y="50" width="120" height="35" rx="4"/>
  <text class="label" x="310" y="72">merkle_root</text>

  <!-- Level 2 -->
  <rect class="node" x="160" y="130" width="100" height="35" rx="4"/>
  <text class="label" x="185" y="152">H1234</text>
  <rect class="node" x="440" y="130" width="100" height="35" rx="4"/>
  <text class="label" x="460" y="152">H5677</text>

  <!-- Level 1 -->
  <rect class="node" x="80" y="210" width="80" height="35" rx="4"/>
  <text class="label" x="100" y="232">H12</text>
  <rect class="node" x="240" y="210" width="80" height="35" rx="4"/>
  <text class="label" x="260" y="232">H34</text>
  <rect class="node" x="400" y="210" width="80" height="35" rx="4"/>
  <text class="label" x="420" y="232">H56</text>
  <rect class="node" x="540" y="210" width="80" height="35" rx="4"/>
  <text class="label" x="560" y="232">H77</text>

  <!-- Leaves -->
  <rect class="node" x="20" y="300" width="70" height="45" rx="4"/>
  <text class="label" x="28" y="318">policy</text>
  <text class="hash" x="28" y="335">L1</text>

  <rect class="node" x="110" y="300" width="70" height="45" rx="4"/>
  <text class="label" x="118" y="318">state</text>
  <text class="hash" x="118" y="335">L2</text>

  <rect class="node" x="200" y="300" width="70" height="45" rx="4"/>
  <text class="label" x="210" y="318">pre-eval</text>
  <text class="hash" x="210" y="335">L3</text>

  <rect class="node" x="290" y="300" width="70" height="45" rx="4"/>
  <text class="label" x="298" y="318">exec</text>
  <text class="hash" x="298" y="335">L4</text>

  <rect class="node" x="380" y="300" width="70" height="45" rx="4"/>
  <text class="label" x="385" y="318">post-eval</text>
  <text class="hash" x="385" y="335">L5</text>

  <rect class="node" x="470" y="300" width="70" height="45" rx="4"/>
  <text class="label" x="480" y="318">score</text>
  <text class="hash" x="480" y="335">L6</text>

  <rect class="node" x="560" y="300" width="70" height="45" rx="4"/>
  <text class="label" x="568" y="318">result</text>
  <text class="hash" x="568" y="335">L7</text>

  <!-- Edges -->
  <line class="edge" x1="350" y1="85" x2="210" y2="130"/>
  <line class="edge" x1="350" y1="85" x2="490" y2="130"/>
  <line class="edge" x1="210" y1="165" x2="120" y2="210"/>
  <line class="edge" x1="210" y1="165" x2="280" y2="210"/>
  <line class="edge" x1="490" y1="165" x2="440" y2="210"/>
  <line class="edge" x1="490" y1="165" x2="580" y2="210"/>
  <line class="edge" x1="120" y1="245" x2="55" y2="300"/>
  <line class="edge" x1="120" y1="245" x2="145" y2="300"/>
  <line class="edge" x1="280" y1="245" x2="235" y2="300"/>
  <line class="edge" x1="280" y1="245" x2="325" y2="300"/>
  <line class="edge" x1="440" y1="245" x2="415" y2="300"/>
  <line class="edge" x1="440" y1="245" x2="505" y2="300"/>
  <line class="edge" x1="580" y1="245" x2="595" y2="300"/>
  <line class="edge" x1="580" y1="245" x2="595" y2="300"/>

  <!-- Annotation -->
  <text class="annotation" x="20" y="380">change any leaf and the root changes</text>
  <text class="annotation" x="400" y="380">signed with ML-DSA-65</text>
</svg>
